<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | FarmConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5, #ffffff);
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #166534;
            padding: 16px 0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-link {
            color: white !important;
            font-weight: 600;
        }

        .page-wrapper {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
            border: 1px solid #dcfce7;
        }

        .title {
            color: #166534;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .btn-add {
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px 25px;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-add:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .btn-back {
            background: #f1f5f9;
            color: #334155;
            border-radius: 12px;
            padding: 13px 25px;
            text-decoration: none;
            font-weight: 700;
        }

        .btn-back:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">
            🌱 FarmConnect
        </a>

        <div>
            <a class="nav-link d-inline-block me-3"
               href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a class="nav-link d-inline-block"
               href="{{ url_for('logout') }}">
                Logout
            </a>
        </div>
    </div>
</nav>


<div class="page-wrapper">

    <div class="product-card">

        <h1 class="title">Add New Product 🌱</h1>

        <p class="subtitle">
            List your fresh farm product and connect directly with buyers.
        </p>

        <form method="POST" action="{{ url_for('add_product') }}">

            <div class="row g-4">

                <!-- Product Name -->
                <div class="col-md-6">
                    <label for="name">Product Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        placeholder="Example: Fresh Tomatoes"
                        required
                    >
                </div>


                <!-- Category -->
                <div class="col-md-6">
                    <label for="category">Category</label>

                    <select
                        id="category"
                        name="category"
                        class="form-select"
                        required
                    >
                        <option value="">Select Category</option>
                        <option value="Vegetables">Vegetables</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Grains">Grains</option>
                        <option value="Pulses">Pulses</option>
                        <option value="Spices">Spices</option>
                        <option value="Dairy">Dairy</option>
                        <option value="Other">Other</option>
                    </select>
                </div>


                <!-- Price -->
                <div class="col-md-6">
                    <label for="price">Price (₹ / kg)</label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        class="form-control"
                        placeholder="Example: 40"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>


                <!-- Quantity -->
                <div class="col-md-6">
                    <label for="quantity">Available Quantity (kg)</label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        class="form-control"
                        placeholder="Example: 100"
                        min="0"
                        step="0.1"
                        required
                    >
                </div>


                <!-- Image -->
                <div class="col-12">
                    <label for="image">Product Image URL</label>

                    <input
                        type="url"
                        id="image"
                        name="image"
                        class="form-control"
                        placeholder="https://example.com/tomatoes.jpg"
                    >

                    <small class="text-muted">
                        Optional — paste an image URL.
                    </small>
                </div>


                <!-- Description -->
                <div class="col-12">
                    <label for="description">Product Description</label>

                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        rows="5"
                        placeholder="Describe freshness, quality, farming method, etc."
                    ></textarea>
                </div>

            </div>


            <div class="d-flex gap-3 mt-4">

                <a
                    href="{{ url_for('dashboard') }}"
                    class="btn-back"
                >
                    ← Back
                </a>

                <button
                    type="submit"
                    class="btn-add"
                >
                    + Add Product
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
