<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | FarmConnect</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #dcfce7,
                    #f0fdf4,
                    #ffffff
                );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 92%;
            max-width: 450px;
            background: white;
            padding: 38px;
            border-radius: 24px;
            box-shadow: 0 20px 55px rgba(20,70,35,.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: #166534;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        .flash {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 700;
            color: #334155;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.15);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .bottom {
            text-align: center;
            color: #64748b;
            margin-top: 22px;
        }

        .bottom a {
            color: #15803d;
            font-weight: 800;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="logo">🌾</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to your FarmConnect account
    </p>

    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="flash">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login →
        </button>

    </form>

    <p class="bottom">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </p>

</div>

</body>
</html>
